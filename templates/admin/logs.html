<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Logs &mdash; Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="admin-layout">
      <header class="admin-header">
        <span class="admin-header-title">Certificate Portal</span>
        <div class="admin-header-actions">
          <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link">Events</a>
          <form action="{{ url_for('admin_logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button class="admin-nav-btn" type="submit">Sign out</button>
          </form>
        </div>
      </header>

      <main class="admin-main">
        <div class="admin-section-header">
          <div>
            <h2>System logs</h2>
            <p class="admin-subtitle">Background jobs and email delivery</p>
          </div>
          <form method="post" action="{{ url_for('admin_clear_logs') }}"
                onsubmit="return confirm('Clear all logs?');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button class="admin-action-btn danger" type="submit">Clear</button>
          </form>
        </div>

        <div class="admin-card">
          {% if logs %}
          <div class="log-viewport" id="logViewport"><pre class="log-output">{{ logs }}</pre></div>
          {% else %}
          <div class="empty-state">
            <p>No logs yet.</p>
            <p class="admin-subtitle">They appear once a background job runs.</p>
          </div>
          {% endif %}
        </div>
      </main>
    </div>

    <script>
      // Newest lines are at the bottom, so open scrolled to the end.
      const viewport = document.getElementById('logViewport');
      if (viewport) viewport.scrollTop = viewport.scrollHeight;
    </script>
  </body>
</html>
