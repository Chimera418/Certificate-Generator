<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Placement &mdash; {{ event.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <style>
      :root {
        --ink: #000; --panel: #0a0a0a; --panel-2: #101010; --panel-3: #161616;
        --rule: #1f1f1f; --rule-hot: #2e2e2e;
        --text: #ededed; --muted: #a1a1a1; --faint: #86868e;
        --ok: #3fb950; --warn: #d29922; --warn-bg: rgba(210,153,34,.11);
        --danger: #f85149; --danger-bg: rgba(248,81,73,.10);
        --ui: "Archivo", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --r-sm: 6px; --dur: 140ms; --ease: cubic-bezier(.2,0,0,1);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ink); color: var(--text);
        font-family: var(--ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
      .shell { display: grid; grid-template-columns: minmax(0,1fr) 428px; height: 100vh; min-height: 640px; }
      @media (max-width: 1080px) { .shell { grid-template-columns: 1fr; height: auto; } }

      .stage { position: relative; display: flex; flex-direction: column; min-width: 0;
        border-right: 1px solid var(--rule);
        background: radial-gradient(120% 90% at 50% 0%, #0d0d0d 0%, #000 62%); }
      .stage-bar { display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 52px;
        flex: 0 0 52px; border-bottom: 1px solid var(--rule); background: rgba(0,0,0,.6); }
      .back-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px 0 10px;
        border: 1px solid var(--rule-hot); border-radius: var(--r-sm); background: var(--panel-2); color: var(--muted);
        font-family: var(--ui); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; flex: 0 0 auto;
        transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
      .back-btn:hover { color: var(--text); background: var(--panel-3); border-color: var(--faint); }
      .back-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
      .back-btn svg { width: 14px; height: 14px; }
      .crumb { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .crumb b { color: var(--text); font-weight: 600; }
      .crumb a { color: var(--faint); text-decoration: none; }
      .crumb a:hover { color: var(--text); }
      .stage-bar .spacer { flex: 1; }
      .dims { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .02em;
        font-variant-numeric: tabular-nums; white-space: nowrap; }
      .save-state { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--faint); white-space: nowrap; }
      .save-state .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background var(--dur) var(--ease); }
      .save-state[data-state="dirty"] { color: var(--warn); } .save-state[data-state="dirty"] .dot { background: var(--warn); }
      .save-state[data-state="saving"] { color: var(--muted); } .save-state[data-state="saving"] .dot { background: var(--muted); }
      .save-state[data-state="saved"] { color: var(--ok); } .save-state[data-state="saved"] .dot { background: var(--ok); }
      .save-state[data-state="error"] { color: var(--danger); } .save-state[data-state="error"] .dot { background: var(--danger); }

      .canvas-wrap { position: relative; flex: 1 1 auto; min-height: 420px; overflow: hidden; }
      canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
      canvas#stage.is-over { cursor: grab; } canvas#stage.is-dragging { cursor: grabbing; }
      .readout { position: absolute; z-index: 4; pointer-events: none; padding: 5px 8px; border-radius: var(--r-sm);
        background: rgba(0,0,0,.9); border: 1px solid var(--rule-hot); font-family: var(--mono); font-size: 11px;
        letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0;
        transform: translate(-50%,-160%); transition: opacity 90ms linear; }
      .readout.on { opacity: 1; } .readout .k { color: var(--faint); }
      .stage-foot { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; padding: 9px 18px;
        border-top: 1px solid var(--rule); background: rgba(0,0,0,.6); font-size: 12px; color: var(--faint); flex-wrap: wrap; }
      kbd { font-family: var(--mono); font-size: 10.5px; padding: 2px 5px; border: 1px solid var(--rule-hot);
        border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }

      .rail { display: flex; flex-direction: column; min-width: 0; background: var(--panel); overflow: hidden; }
      .rail-head { display: flex; align-items: baseline; gap: 10px; padding: 18px 22px 14px; border-bottom: 1px solid var(--rule); }
      .rail-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
      .count { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
      .count.at-cap { color: var(--warn); }

      /* Sized to show every field (max 5) without an inner scroll on normal screens;
         only a short viewport forces it to scroll. The inspector below absorbs the rest. */
      .fields { list-style: none; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 7px;
        flex: 0 1 auto; max-height: min(440px, 56vh); overflow-y: auto; border-bottom: 1px solid var(--rule); }
      @media (max-width: 1080px) { .fields { max-height: none; } }
      .field-row { --hue: #e8b339; position: relative; display: grid; grid-template-columns: 14px 1fr auto auto;
        align-items: center; gap: 10px; padding: 12px 11px 12px 0; border: 1px solid transparent; border-radius: var(--r-sm);
        background: var(--panel-2); cursor: pointer; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
      .field-row:hover { background: var(--panel-3); }
      .field-row.sel { background: var(--panel-3); border-color: var(--rule-hot); }
      .field-row.dragging { opacity: .4; }
      .field-row.drop-before { box-shadow: inset 0 2px 0 var(--hue); } .field-row.drop-after { box-shadow: inset 0 -2px 0 var(--hue); }
      .spine { align-self: stretch; width: 3px; margin-left: 6px; border-radius: 2px; background: var(--hue); opacity: .5; transition: opacity var(--dur) var(--ease); }
      .field-row.sel .spine { opacity: 1; }
      .f-main { min-width: 0; } .f-label { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .f-sub { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      .src { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
        padding: 3px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid; }
      .src[data-s="input"] { color: var(--warn); border-color: rgba(210,153,34,.4); background: var(--warn-bg); }
      .src[data-s="csv"] { color: #9fd4dd; border-color: rgba(76,195,212,.3); background: rgba(76,195,212,.09); }
      .src[data-s="static"] { color: var(--muted); border-color: var(--rule-hot); background: var(--panel-3); }
      .icon-btn { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid transparent;
        border-radius: var(--r-sm); background: none; color: var(--faint); cursor: pointer;
        transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
      .icon-btn:hover { color: var(--danger); background: var(--danger-bg); border-color: rgba(248,81,73,.3); }
      .icon-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; } .icon-btn svg { width: 13px; height: 13px; }
      .grip { cursor: grab; color: var(--rule-hot); display: grid; place-items: center; width: 16px; }
      .grip:active { cursor: grabbing; } .grip svg { width: 11px; height: 11px; }
      .add-row { padding: 8px; border-bottom: 1px solid var(--rule); }
      .add-btn { width: 100%; height: 38px; border: 1px dashed var(--rule-hot); border-radius: var(--r-sm); background: none;
        color: var(--muted); font-family: var(--ui); font-size: 13px; font-weight: 500; cursor: pointer;
        transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
      .add-btn:hover:not(:disabled) { color: var(--text); border-color: var(--faint); background: var(--panel-2); }
      .add-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
      .add-btn:disabled { opacity: .4; cursor: not-allowed; }

      .inspector { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

      .rail-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 13px 22px;
        border-top: 1px solid var(--rule); background: var(--panel-2); }
      .rail-foot .save-state { margin-right: auto; }
      .save-btn { flex: 0 0 auto; height: 40px; padding: 0 26px; border: 1px solid rgba(63,185,80,.5);
        border-radius: var(--r-sm); background: rgba(63,185,80,.14); color: #7ee29a; font-family: var(--ui);
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
      .save-btn:hover:not(:disabled) { background: rgba(63,185,80,.24); border-color: var(--ok); color: #a7ecb9; }
      .save-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
      .save-btn:disabled { opacity: .55; cursor: default; }
      .insp-head { position: sticky; top: 0; z-index: 2; --hue: #e8b339; display: flex; align-items: center; gap: 10px;
        padding: 13px 18px; background: var(--panel-2); border-bottom: 1px solid var(--rule); box-shadow: inset 3px 0 0 var(--hue); }
      .insp-head .n { font-family: var(--mono); font-size: 11px; color: var(--hue); font-weight: 600; }
      .insp-head h3 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .group { padding: 18px 22px; border-bottom: 1px solid var(--rule); }
      .group > .gt { margin: 0 0 14px; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      /* Collapsible inspector sections. The header toggles its body; state persists
         across field switches so a folded section stays folded. */
      .ig { border-bottom: 1px solid var(--rule); }
      .ig__head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 15px 22px; text-align: left;
        background: none; border: none; cursor: pointer; color: var(--faint);
        transition: color var(--dur) var(--ease); }
      .ig__head:hover { color: var(--text); }
      .ig__head:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
      .ig__t { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-family: var(--ui); }
      .ig__chev { width: 14px; height: 14px; margin-left: auto; color: var(--rule-hot); flex: 0 0 auto;
        transition: transform var(--dur) var(--ease), color var(--dur) var(--ease); }
      .ig__head:hover .ig__chev { color: var(--faint); }
      .ig.is-collapsed .ig__chev { transform: rotate(-90deg); }
      .ig__body { padding: 0 22px 18px; }
      .ig.is-collapsed .ig__body { display: none; }
      .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .ctl > label { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
      input[type="text"], input[type="number"], select { width: 100%; height: 36px; padding: 0 9px; border: 1px solid var(--rule-hot);
        border-radius: var(--r-sm); background: var(--ink); color: var(--text); font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
        transition: border-color var(--dur) var(--ease); }
      select { font-family: var(--ui); font-size: 13px; cursor: pointer; }
      input:focus, select:focus { outline: none; border-color: var(--faint); }
      input:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: -1px; }
      input[type="color"] { width: 100%; height: 36px; padding: 3px; border: 1px solid var(--rule-hot); border-radius: var(--r-sm); background: var(--ink); cursor: pointer; }
      .seg { display: grid; grid-template-columns: repeat(3,1fr); border: 1px solid var(--rule-hot); border-radius: var(--r-sm); overflow: hidden; }
      .seg button { height: 36px; border: none; background: var(--ink); color: var(--faint); font-family: var(--mono); font-size: 10.5px;
        font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; border-right: 1px solid var(--rule-hot);
        transition: color var(--dur) var(--ease), background var(--dur) var(--ease); }
      .seg button:last-child { border-right: none; }
      .seg button:hover { color: var(--text); background: var(--panel-2); }
      .seg button:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
      .seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--text); }
      .seg button[aria-pressed="true"][data-s="input"] { color: var(--warn); box-shadow: inset 0 -2px 0 var(--warn); }
      .seg button[aria-pressed="true"][data-s="csv"] { color: #9fd4dd; box-shadow: inset 0 -2px 0 #4cc3d4; }
      .seg button[aria-pressed="true"][data-s="static"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--faint); }
      .seg button:disabled { opacity: .35; cursor: not-allowed; }
      .note { display: flex; gap: 9px; margin-top: 11px; padding: 10px 11px; border-radius: var(--r-sm); font-size: 12px; line-height: 1.5;
        border: 1px solid var(--rule-hot); background: var(--panel-2); color: var(--muted); }
      .note svg { width: 14px; height: 14px; flex: 0 0 14px; margin-top: 2px; }
      .note.warn { border-color: rgba(210,153,34,.35); background: var(--warn-bg); color: #e6c674; } .note.warn svg { color: var(--warn); }
      .note b { color: var(--text); font-weight: 600; } .note code { font-family: var(--mono); font-size: 11px; color: var(--text); }
      .empty { padding: 40px 24px; text-align: center; color: var(--faint); font-size: 13px; line-height: 1.6; }
      .hint { font-size: 11.5px; color: var(--faint); line-height: 1.5; margin: 7px 0 0; }
      .hint code { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
      /* Slim, quiet scrollbars - the OS default arrow buttons crowded the rail. */
      .fields, .inspector { scrollbar-width: thin; scrollbar-color: var(--rule-hot) transparent; }
      .fields::-webkit-scrollbar, .inspector::-webkit-scrollbar { width: 11px; }
      .fields::-webkit-scrollbar-track, .inspector::-webkit-scrollbar-track { background: transparent; }
      .fields::-webkit-scrollbar-thumb, .inspector::-webkit-scrollbar-thumb {
        background: var(--rule-hot); border-radius: 999px; border: 3px solid var(--panel); background-clip: padding-box; }
      .fields::-webkit-scrollbar-thumb:hover, .inspector::-webkit-scrollbar-thumb:hover { background: var(--faint); }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
    </style>
  </head>
  <body>
    <script type="application/json" id="editor-data">
      {
        "fields": {{ fields_json | safe }},
        "columns": {{ columns_json | safe }},
        "sampleRows": {{ sample_rows_json | safe }},
        "fonts": {{ fonts_json | safe }},
        "maxFields": {{ max_fields }},
        "hasCsv": {{ 'true' if has_csv else 'false' }},
        "slug": "{{ event.slug }}",
        "templateUrl": "{{ template_url }}",
        "saveUrl": "{{ save_url }}",
        "backUrl": "{{ back_url }}",
        "csrf": "{{ csrf_token() }}"
      }
    </script>

    <div class="shell">
      <section class="stage">
        <div class="stage-bar">
          <a class="back-btn" href="{{ back_url }}" title="Back to the event">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>
          <div class="crumb"><a href="{{ back_url }}">{{ event.name }}</a>
            <span style="color: var(--rule-hot)">/</span> <b>Field placement</b></div>
          <div class="spacer"></div>
          <div class="dims" id="dims">&mdash;</div>
        </div>
        <div class="canvas-wrap" id="wrap">
          <canvas id="stage"></canvas>
          <div class="readout" id="readout"></div>
        </div>
        <div class="stage-foot">
          <span><kbd>click</kbd> select</span>
          <span><kbd>drag</kbd> move</span>
          <span><kbd>&larr;&uarr;&darr;&rarr;</kbd> nudge</span>
          <span><kbd>shift</kbd> + arrows 10px</span>
          <span><kbd>tab</kbd> next</span>
          <span><kbd>del</kbd> remove</span>
        </div>
      </section>

      <aside class="rail">
        <div class="rail-head"><h2>Fields</h2><span class="count" id="count">0 / 5</span></div>
        <ul class="fields" id="list"></ul>
        <div class="add-row"><button class="add-btn" id="add">Add field</button></div>
        <div class="inspector" id="inspector"></div>
        <div class="rail-foot">
          <div class="save-state" id="saveState" data-state="idle"><span class="dot"></span><span id="saveText">No changes</span></div>
          <button class="save-btn" id="saveBtn" type="button">Save</button>
        </div>
      </aside>
    </div>

    <script>
      "use strict";
      const DATA = JSON.parse(document.getElementById("editor-data").textContent);
      const MAX_FIELDS = DATA.maxFields;
      const HUES = ["#e8b339", "#4cc3d4", "#e4707f", "#93c34a", "#a48ae0"];
      const FONTS = DATA.fonts;                       // [{key,label,family,weight,url}]
      const FONT_BY_KEY = Object.fromEntries(FONTS.map((f) => [f.key, f]));
      const DEFAULT_FONT = (FONTS[0] || { key: "montserrat_bold" }).key;
      const COLUMNS = DATA.columns;
      const SAMPLE_ROWS = DATA.sampleRows;
      const PERSON_HINTS = ["name", "email", "mail", "phone", "mobile", "roll", "reg", "id",
        "player", "student", "participant", "member", "user", "person", "usn", "prn"];

      // ── colour helpers: fields carry [r,g,b]; the colour input wants #rrggbb ──
      const rgbToHex = (c) => "#" + (c || [50, 34, 24]).slice(0, 3)
        .map((n) => Math.max(0, Math.min(255, n | 0)).toString(16).padStart(2, "0")).join("");
      const hexToRgb = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return [50, 34, 24];
        const v = m[1]; return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)]; };

      // Editor-local field: server [r,g,b] becomes a hex string for the colour input.
      function fromServer(f, i) {
        return {
          id: f.id || ("field_" + (i + 1)), label: f.label || f.id || ("Field " + (i + 1)),
          source: f.source || "input", column: f.column || "", value: f.value || "",
          x: f.x | 0, y: f.y | 0, font_size: f.font_size || 100, font_color: rgbToHex(f.font_color),
          font_key: FONT_BY_KEY[f.font_key] ? f.font_key : DEFAULT_FONT,
          align: f.align || "center", max_width: f.max_width || null,
          overflow: f.overflow || "shrink", depends_on: f.depends_on || null,
        };
      }
      function toServer(f) {
        return {
          id: f.id, label: f.label, source: f.source,
          column: f.source === "csv" ? f.column : "", value: f.source === "static" ? f.value : "",
          x: Math.round(f.x), y: Math.round(f.y), font_size: Math.round(f.font_size),
          font_color: hexToRgb(f.font_color), font_key: f.font_key, align: f.align,
          max_width: f.max_width ? Math.round(f.max_width) : null, overflow: f.overflow,
          depends_on: f.depends_on || null,
        };
      }

      let fields = (DATA.fields || []).map(fromServer);
      if (!fields.length) fields = [fromServer({ id: "name", label: "Name", source: "input", x: 0, y: 0 }, 0)];
      let selected = 0;
      let sampleRow = 0;
      // Which inspector sections are folded. Global (persists as you switch fields),
      // so a section you collapse stays collapsed. Toggled by its header.
      const groupCollapsed = { where: false, label: true, place: false, type: false, preview: true };
      function grp(key, title, body) {
        const col = groupCollapsed[key] ? " is-collapsed" : "";
        return '<section class="ig' + col + '" data-g="' + key + '">' +
          '<button type="button" class="ig__head" data-gtoggle="' + key + '"><span class="ig__t">' + title + '</span>' +
          '<svg class="ig__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
          '</button><div class="ig__body">' + body + '</div></section>';
      }

      const cv = document.getElementById("stage");
      const ctx = cv.getContext("2d");
      const wrap = document.getElementById("wrap");
      const listEl = document.getElementById("list");
      const inspEl = document.getElementById("inspector");
      const countEl = document.getElementById("count");
      const addBtn = document.getElementById("add");
      const readout = document.getElementById("readout");
      const saveState = document.getElementById("saveState");
      const saveText = document.getElementById("saveText");
      const saveBtn = document.getElementById("saveBtn");
      const dimsEl = document.getElementById("dims");
      // Explicit save forces an immediate write, cancelling the pending autosave debounce.
      saveBtn.addEventListener("click", () => { clearTimeout(saveTimer); save(); });
      // Leaving with unsaved edits: flush the save first, then navigate regardless of
      // outcome (an unsavable draft - e.g. a validation error - shouldn't trap the user).
      const backBtn = document.querySelector(".back-btn");
      backBtn.addEventListener("click", (e) => {

        if (f.source === "static")
          return '<div class="ctl" style="margin-top:11px"><label for="i-value">Value printed on every certificate</label>' +
            '<input id="i-value" type="text" value="' + esc(f.value) + '" data-k="value" style="font-family:var(--ui)"></div>' +
            '<div class="note">' + ICON_LOCK + "<span>The same on every certificate. Participants cannot change it.</span></div>";
        if (noCsv)
          return '<div class="note warn">' + ICON_WARN + "<span>No participants file is uploaded, so there are no columns to read. Upload one, or use Input or Static.</span></div>";
        const isPerson = looksPersonLevel(f.column);
        return '<div class="ctl" style="margin-top:11px"><label for="i-column">Column from the participants file</label>' +
          '<select id="i-column" data-k="column">' + COLUMNS.map((c) => '<option value="' + esc(c) + '"' + (f.column === c ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select></div>" +
          '<div class="note">' + ICON_LOCK + "<span>Read from the row the participant matched. They never type it and cannot change it. Prints verbatim &mdash; <code>07</code> stays <code>07</code>.</span></div>" +
          (isPerson ? '<div class="note warn">' + ICON_WARN + "<span>This looks like a per-person column. It is filled from the matched row automatically &mdash; that is fine. (Publishing it as a public dropdown is a separate setting on the event form.)</span></div>" : "");
      }
      function syncInspectorValues() {
        const f = fields[selected]; if (!f) return;
        const x = inspEl.querySelector('[data-k="x"]'), y = inspEl.querySelector('[data-k="y"]');
        if (x && document.activeElement !== x) x.value = f.x; if (y && document.activeElement !== y) y.value = f.y;
      }
      function clampNum(el) { const n = Number(el.value); if (Number.isNaN(n)) return 0;
        const lo = el.min === "" ? -Infinity : Number(el.min), hi = el.max === "" ? Infinity : Number(el.max);
        return Math.max(lo, Math.min(hi, Math.round(n))); }

      // ── autosave ──
      let saveTimer = null, saving = false, queued = false, savePromise = null;
      function markDirty() { saveState.dataset.state = "dirty"; saveText.textContent = "Unsaved changes";
        saveBtn.disabled = false; saveBtn.textContent = "Save";
        clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
      function save() {
        if (saving) { queued = true; return savePromise || Promise.resolve(); }
        saving = true; queued = false; saveState.dataset.state = "saving"; saveText.textContent = "Saving…";
        saveBtn.disabled = true; saveBtn.textContent = "Saving…";
        savePromise = fetch(DATA.saveUrl, { method: "POST", headers: { "Content-Type": "application/json",
          "X-CSRF-Token": DATA.csrf, "X-Requested-With": "XMLHttpRequest" },
          body: JSON.stringify({ fields: fields.map(toServer) }) })
          .then(async (res) => { const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.ok) throw new Error(body.error || "Save failed");
            saveState.dataset.state = "saved"; saveText.textContent = "Saved"; saveBtn.textContent = "Saved"; })
          .catch((err) => { saveState.dataset.state = "error"; saveText.textContent = err.message || "Save failed";
            saveBtn.textContent = "Retry save"; })
          .finally(() => { saving = false; saveBtn.disabled = false; if (queued) save(); });
        return savePromise;
      }

      function renderAll() { renderList(); renderInspector(); draw(); }

      // ── boot ──
      function loadFonts() {
        if (!window.FontFace) return Promise.resolve();
        return Promise.all(FONTS.map((o) => {
          const face = new FontFace(canvasFamily(o.key), "url(" + o.url + ")", { weight: String(o.weight || 700) });
          return face.load().then((f) => document.fonts.add(f)).catch(() => undefined);
        }));
      }
      function loadTemplate() {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => { template = img; TPL_W = img.naturalWidth || 3508; TPL_H = img.naturalHeight || 2480;
            dimsEl.textContent = TPL_W + " × " + TPL_H; resolve(); };
          img.onerror = () => { dimsEl.textContent = "template unavailable"; resolve(); };
          img.src = DATA.templateUrl + "?t=" + Date.now();
        });
      }
      new ResizeObserver(fit).observe(wrap);
      renderAll();
      Promise.all([loadTemplate(), loadFonts()]).then(fit);
    </script>
  </body>
</html>
