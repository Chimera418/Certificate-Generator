<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Send emails &mdash; {{ event.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="coord-editor-layout">
      <div class="coord-editor-canvas">
        <canvas id="certEditorCanvas"></canvas>
      </div>

      <div class="coord-editor-panel">
        <form id="editorForm" method="post"
              action="{{ url_for('admin_send_emails', slug=event.slug) }}"
              onsubmit="return confirm('Generate and email certificates to everyone in the participant list?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <h3>Message</h3>

          <div class="coord-editor-control">
            <label for="subject_template">Subject</label>
            <input type="text" id="subject_template" name="subject_template"
                   value="Your Certificate for {event_name}" required />
            <p class="field-hint">
              Placeholders: <code>{participant_name}</code>, <code>{event_name}</code>
            </p>
          </div>

          <div class="coord-editor-control">
            <label for="plain_body_template">Plain text body</label>
            <textarea id="plain_body_template" name="plain_body_template" rows="6" required>Hello {participant_name},

Attached is your certificate for {event_name}. Congratulations!

Best regards,
The Organizers</textarea>
          </div>

          <div class="coord-editor-control">
            <label for="html_body_template">HTML body</label>
            <textarea id="html_body_template" name="html_body_template" rows="8" required>&lt;html&gt;
  &lt;body&gt;
    &lt;p&gt;Hello &lt;b&gt;{participant_name}&lt;/b&gt;,&lt;/p&gt;
    &lt;p&gt;Attached is your certificate for &lt;b&gt;{event_name}&lt;/b&gt;. Congratulations!&lt;/p&gt;
    &lt;p&gt;Best regards,&lt;br&gt;The Organizers&lt;/p&gt;
  &lt;/body&gt;
&lt;/html&gt;</textarea>
          </div>

          <h3>Certificate</h3>

          <div class="coord-editor-control">
            <label for="sample_text">Preview name</label>
            <input id="sample_text" type="text" value="Test Participant" autocomplete="off" />
          </div>

          <div class="coord-row">
            <div class="coord-editor-control">
              <label for="text_x">X</label>
              <input id="text_x" name="text_x" class="coord-input" type="number" min="0"
                     value="{{ event.text_x if event else 1789 }}" />
            </div>
            <div class="coord-editor-control">
              <label for="text_y">Y</label>
              <input id="text_y" name="text_y" class="coord-input" type="number" min="0"
                     value="{{ event.text_y if event else 1440 }}" />
            </div>
          </div>

          <div class="coord-row">
            <div class="coord-editor-control">
              <label for="font_size">Size</label>
              <input id="font_size" name="font_size" class="coord-input" type="number" min="8"
                     value="{{ event.font_size if event else 100 }}" />
            </div>
            <div class="coord-editor-control">
              <label for="font_color">Colour</label>
              {% set fc = event.font_color if event and event.font_color else [50, 34, 24] %}
              <input id="font_color" name="font_color" type="color"
                     value="#{{ '%02x%02x%02x' % (fc[0], fc[1], fc[2]) }}" />
            </div>
          </div>

          <div class="coord-editor-control">
            <label for="font_key">Typeface</label>
            <select id="font_key" name="font_key">
              {% set selected_font_key = event.font_key if event and event.font_key else default_font_key %}
              {% for option in font_options %}
              <option value="{{ option.key }}"
                      data-family="{{ option.css_family }}"
                      data-weight="{{ option.css_weight }}"
                      data-url="{{ url_for('font_asset', font_key=option.key) }}"
                      {{ 'selected' if option.key == selected_font_key else '' }}>{{ option.label }}</option>
              {% endfor %}
            </select>
          </div>

          <p class="coord-info">
            Sending runs in the background. Progress appears in
            <strong>Logs</strong>, and it cannot be stopped once started.
          </p>

          <div class="coord-editor-actions">
            <button type="submit" class="coord-editor-btn">Send emails</button>
            <a href="{{ url_for('admin_dashboard') }}"
               class="button-link secondary coord-editor-btn">Cancel</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('certEditorCanvas');
      const ctx = canvas.getContext('2d');

      const textXInput = document.getElementById('text_x');
      const textYInput = document.getElementById('text_y');
      const fontSizeInput = document.getElementById('font_size');
      const fontKeyInput = document.getElementById('font_key');
      const fontColorInput = document.getElementById('font_color');
      const sampleTextInput = document.getElementById('sample_text');
      const templatePreviewUrl = "{{ url_for('admin_template_preview', slug=event.slug) }}";

      let certImage = null;
      let maxCanvasWidth = 0;
      let maxCanvasHeight = 0;
      let scaleX = 1;
      let scaleY = 1;
      let isDragging = false;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      const loadedPreviewFonts = new Set();

      function selectedPreviewFont() {
        const selected = fontKeyInput && fontKeyInput.selectedOptions
          ? fontKeyInput.selectedOptions[0]
          : null;
        return {
          family: (selected && selected.dataset.family) || 'Montserrat Bold',
          weight: (selected && selected.dataset.weight) || '700',
          url: (selected && selected.dataset.url) || ''
        };
      }

      function ensurePreviewFontLoaded() {
        const font = selectedPreviewFont();
        if (!document.fonts) return Promise.resolve();
        if (loadedPreviewFonts.has(font.family)) {
          return document.fonts.load(`${font.weight} 32px "${font.family}"`).catch(() => undefined);
        }
        if (window.FontFace && font.url) {
          const face = new FontFace(font.family, `url(${font.url})`, { weight: font.weight });
          return face.load().then((loaded) => {
            document.fonts.add(loaded);
            loadedPreviewFonts.add(font.family);
            return document.fonts.load(`${font.weight} 32px "${font.family}"`);
          }).catch(() => undefined);
        }
        return document.fonts.load(`${font.weight} 32px "${font.family}"`).catch(() => undefined);
      }

      function resizeCanvas() {
        const container = canvas.parentElement;
        maxCanvasWidth = container.clientWidth - 32;
        maxCanvasHeight = container.clientHeight - 32;
        drawPreview();
      }

      function loadCertImage() {
        const img = new Image();
        img.onload = () => {
          certImage = img;
          ensurePreviewFontLoaded().finally(resizeCanvas);
        };
        img.onerror = () => {
          certImage = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#85858f';
          ctx.font = '600 16px system-ui, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Preview unavailable', canvas.width / 2, canvas.height / 2);
        };
        img.src = `${templatePreviewUrl}?t=${Date.now()}`;
      }

      function drawPreview() {
        if (!certImage) return;

        const imgAspect = certImage.width / certImage.height;
        let drawWidth = maxCanvasWidth;
        let drawHeight = drawWidth / imgAspect;
        if (drawHeight > maxCanvasHeight) {
          drawHeight = maxCanvasHeight;
          drawWidth = drawHeight * imgAspect;
        }

        scaleX = drawWidth / certImage.width;
        scaleY = drawHeight / certImage.height;
        canvas.width = drawWidth;
        canvas.height = drawHeight;

        ctx.drawImage(certImage, 0, 0, drawWidth, drawHeight);

        const x = parseInt(textXInput.value, 10) * scaleX;
        const y = parseInt(textYInput.value, 10) * scaleY;
        const size = (parseInt(fontSizeInput.value, 10) * scaleX) / 2;
        const color = fontColorInput.value || '#321812';
        const displayText = sampleTextInput.value.trim() || 'Sample Text';
        const font = selectedPreviewFont();

        if (isDragging) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.beginPath();
          ctx.arc(x, y, size * 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - size * 1.5, y);
        ctx.lineTo(x + size * 1.5, y);
        ctx.moveTo(x, y - size * 1.5);
        ctx.lineTo(x, y + size * 1.5);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.font = `${font.weight} ${Math.max(10, parseInt(fontSizeInput.value, 10) * scaleX)}px "${font.family}", Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayText, x, y);
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (!certImage) return;
        const rect = canvas.getBoundingClientRect();
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const textX = parseInt(textXInput.value, 10) * scaleX;
        const textY = parseInt(textYInput.value, 10) * scaleY;
        const size = (parseInt(fontSizeInput.value, 10) * scaleX) / 2;
        const distX = pointerX - textX;
        const distY = pointerY - textY;

        if (Math.sqrt(distX * distX + distY * distY) < Math.max(size * 2, 28)) {
          isDragging = true;
          dragOffsetX = distX;
          dragOffsetY = distY;
          canvas.setPointerCapture(event.pointerId);
          canvas.style.cursor = 'grabbing';
          event.preventDefault();
        }
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!isDragging || !certImage) return;
        const rect = canvas.getBoundingClientRect();
        textXInput.value = Math.max(0, Math.round((event.clientX - rect.left - dragOffsetX) / scaleX));
        textYInput.value = Math.max(0, Math.round((event.clientY - rect.top - dragOffsetY) / scaleY));
        drawPreview();
        event.preventDefault();
      });

      function endDrag(event) {
        if (!isDragging) return;
        isDragging = false;
        canvas.style.cursor = 'crosshair';
        if (event && event.pointerId !== undefined && canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
        drawPreview();
      }

      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);

      [textXInput, textYInput, fontSizeInput, fontColorInput, sampleTextInput].forEach((input) => {
        input.addEventListener('input', drawPreview);
      });
      if (fontKeyInput) {
        fontKeyInput.addEventListener('change', () => {
          ensurePreviewFontLoaded().finally(drawPreview);
        });
      }

      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('load', loadCertImage);
    </script>
  </body>
</html>
