<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{{ club.name }} &mdash; Certificates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="wrap">
      <div class="page-head" style="margin-top:var(--space-6)">
        <div class="page-head__text">
          <h1>{{ club.name }}</h1>
          <p class="sub">Choose an event to claim your certificate.</p>
        </div>
      </div>

      {% if events %}
      <div class="events">
        {% for event in events %}
        <a class="event-row" href="{{ url_for('club_event_page', club_slug=club_slug, event_slug=event.slug) }}">
          <span class="event-row__main">
            <span class="event-row__name">{{ event.name }}</span>
          </span>
          <span class="event-row__chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span>
        </a>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 8 21l4-2 4 2-1-7.5"/></svg>
        <p>No public certificates are available yet.</p>
      </div>
      {% endif %}
    </main>
  </body>
</html>
