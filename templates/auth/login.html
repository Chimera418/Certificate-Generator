<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Club sign in &mdash; Certificate Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="auth">
      <section class="auth__card">
        <div class="auth__brand">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 8 21l4-2 4 2-1-7.5"/></svg></span>
          Certificate Portal
        </div>
        <h1>Club sign in</h1>
        <p class="lede">Manage your events and certificates.</p>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <form action="{{ url_for('club_login') }}" method="post" class="form" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <label class="field-label" for="slug">Club address</label>
          <input id="slug" name="slug" type="text" placeholder="start typing your address"
                 autocomplete="off" list="club-suggestions" required />
          <datalist id="club-suggestions"></datalist>

          <label class="field-label" for="password" style="margin-top:var(--space-3)">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button type="submit" style="margin-top:var(--space-4)">Sign in</button>
        </form>

        <p class="alt">New here? <a href="{{ url_for('club_register') }}">Register a club</a></p>
      </section>
    </main>
    <script>
      // Autocomplete addresses only after 3 characters, so the full club list is
      // never delivered on page load.
      const slug = document.getElementById('slug');
      const list = document.getElementById('club-suggestions');
      let timer = null;
      slug.addEventListener('input', () => {
        clearTimeout(timer);
        const q = slug.value.trim().toLowerCase();
        if (q.length < 3) { list.innerHTML = ''; return; }
        timer = setTimeout(async () => {
          try {
            const res = await fetch('/clubs/autocomplete?q=' + encodeURIComponent(q));
            const data = await res.json();
            list.innerHTML = (data.slugs || []).map(s => '<option value="' + s + '"></option>').join('');
          } catch (e) { /* offline: typing still works */ }
        }, 150);
      });
    </script>
  </body>
</html>
