services:
  - type: web
    name: certificate-generator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 120 --access-logfile -
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Signs admin sessions and certificate links, so it must stay identical
      # across workers and restarts. Render generates it once and stores it.
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Secrets: set these in the Render dashboard, never in this file.
      - key: ADMIN_PASSWORD
        sync: false
      # Supabase Storage holds templates and participant lists.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: csi-aseb
      # Upstash KV holds event configs. Participant lists moved to Supabase and
      # are only read from KV for events uploaded before that change.
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
